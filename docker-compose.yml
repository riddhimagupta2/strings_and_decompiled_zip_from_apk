services:
  api:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      UPLOAD_DIR: storage/uploads
      ARTIFACT_DIR: storage/artifacts
      CHROMA_DB_PATH: storage/chroma_db
    volumes:
      - apk_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  apk_storage:
